# NYXERON behind a proxy that already owns ports 80/443 on the VPS (e.g. another project's Caddy):
#   docker compose -f deploy/compose.yml -f deploy/compose.behind-proxy.yml up -d --build
# The edge publishes no ports and serves plain HTTP on the proxy's Docker network as "nyxeron-edge"; that proxy
# terminates TLS for the domain and forwards everything to it:
#   nyxeron.xyz {
#       reverse_proxy nyxeron-edge:80
#   }
services:
  edge:
    ports: !reset []
    environment:
      SITE_ADDRESS: ":80"
    networks:
      default: {}
      gateway:
        aliases: [nyxeron-edge]

networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-deploy_default}
