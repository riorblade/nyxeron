# NYXERON on one VPS: `docker compose -f deploy/compose.yml up -d --build`
# Three separate services; only the edge publishes ports. Each has a hard memory cap and a read-only filesystem.
name: nyxeron

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "2" }

services:
  edge:
    <<: *hardened
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    ports: ["80:80", "443:443", "443:443/udp"]
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${DOMAIN:-localhost}
      # Caddy is Go too: keep its heap under the cap.
      GOMEMLIMIT: 48MiB
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
    mem_limit: 64m
    depends_on: [relay, api]

  # Multiplayer relay: connects players, nothing else (no game logic, no database).
  relay:
    <<: *hardened
    build: ../services/relay
    environment:
      ORIGINS: ${DOMAIN:-localhost}
      MAX_ROOMS: "2000"
      MAX_PEERS: "64"
      GRACE_SEC: "60"
      # Abuse limits (docs/multiplayer.md). Sockets must fit mem_limit: the load test (10 rooms × 30 players, live
      # snapshots) peaks at ~31 MB RSS for 310 sockets, so 400 is the safe cap at 48 MB. Raise MAX_CONNS together
      # with mem_limit (~85 KB a busy socket: 96 MB ≈ 900).
      MAX_CONNS: "400"
      MAX_CONNS_PER_IP: "100"
      MAX_ROOMS_PER_IP: "8"
      QUEUE_BUDGET_MB: "8"
      KICK_BAN_SEC: "600"
      # Only Caddy reaches the relay (expose, not ports), so its X-Forwarded-For is the real client IP.
      TRUST_PROXY: "1"
      # Keep the Go heap well under the container cap: collect at +50% heap growth (default 100%), and hard at
      # the soft limit before an OOM kill.
      GOGC: "50"
      GOMEMLIMIT: 40MiB
    expose: ["8787"]
    mem_limit: 48m

  # Game API (spot quotes): separate from the relay, restarts and scales on its own.
  api:
    <<: *hardened
    build: ../services/api
    environment:
      BINANCE_WEB3_API_KEY: ${BINANCE_WEB3_API_KEY:-}
      BINANCE_WEB3_SECRET_KEY: ${BINANCE_WEB3_SECRET_KEY:-}
      # Privy sign-in, verified server-side (GET /api/me). The secret stays in this service.
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET:-}
      # Back office owners (comma-separated emails); they add other admins from the back office itself.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # The platform's stock agent (GET /api/agent/demand, POST /api/agent/restock). Empty: agent API off.
      AGENT_KEY: ${AGENT_KEY:-}
      # BNB Smart Chain, read through two providers that must agree (services/api/bsc.go).
      BSC_RPC_1: ${BSC_RPC_1:-}
      BSC_RPC_2: ${BSC_RPC_2:-}
      # Live rooms on the back office overview (the relay's internal /stats).
      RELAY_URL: http://relay:8787
      GOGC: "50"
      GOMEMLIMIT: 40MiB
      # Players' data (SQLite) and its daily backups, on a volume.
      DB_PATH: /data/nyxeron.db
    volumes:
      - api_data:/data
    tmpfs: [/tmp]
    expose: ["8788"]
    mem_limit: 48m

volumes:
  api_data:
  caddy_data:
  caddy_config:
