name: PR checks

# Every PR must use the template (.github/pull_request_template.md) and a "type(scope): summary" title.
# Make this check required in Settings → Branches → main so nothing merges without it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  template:
    name: Title and description follow the template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/github-script@v7
        with:
          script: |
            const { checkPr } = require("./.github/scripts/check-pr.cjs");
            const pr = context.payload.pull_request;
            const problems = checkPr({ title: pr.title, body: pr.body || "" });
            if (problems.length) {
              core.summary.addHeading("Fix the PR title/description").addList(problems).write();
              core.setFailed("The PR doesn't follow the template:\n- " + problems.join("\n- "));
            } else core.info("PR title and description follow the template.");

  labels:
    name: Label by area
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
